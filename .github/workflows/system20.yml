name: System 20 verification
on:
  push:
    paths:
      - 'system20/**'
      - '.github/workflows/system20.yml'
  pull_request:
    paths:
      - 'system20/**'
      - '.github/workflows/system20.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest system20.test_engine -v
